# The 0.1 contract fixture for the thin projection (plan 057-A).
#
# This file mirrors projects/upstream_marts/proxy-config.yaml: the same grain,
# keys, serving names, relationships, measure declarations and flag catalogue,
# without any SQL. Deployment specifics (catalog, cube name, db_path) are not
# the contract's business, and level numbers plus the calendar's year/quarter/
# month columns derive from the declared levels.
#
# It is hand-written today so the schema, the validator and the CI gate exist
# before the generators; the sqlmesh/dbt generators replace it in a later slice.
#
# Prove it:  cargo run --bin mallard -- contract validate contracts/upstream_marts/contract.yaml

contract_version: "0.1.0"

model:
  name: upstream_marts
  description: >-
    Thin projection of the governed marts: additive sums and ratio-of-sums over
    fact_orders, and identity aggregates over the per-grain marts. No measure
    logic lives in the proxy.

grain:
  - table: fact_orders
    key: order_id
    id: orders
    measure_group: Orders
  - table: mart_lead_time_median_month
    key: [year, month, product_key]
    id: lead_time_median
    measure_group: "Lead time (median, monthly)"
  - table: mart_cumulative_month
    key: [year, month]
    id: cumulative
    measure_group: "Revenue (cumulative, monthly)"

dimensions:
  - id: Date
    table: dim_date
    key: date_key
    attribute: full_date
    hierarchy_name: Calendar
    date_role: true
    caption: Date
    ordinal: 1
    cardinality_hint: 1200
    levels:
      - { name: Year, column: year, cardinality_hint: 3 }
      - { name: Quarter, column: quarter, cardinality_hint: 12 }
      - { name: Month, column: month, cardinality_hint: 36 }
      - { name: Full Date, column: full_date, cardinality_hint: 1200 }
  - id: Category
    table: dim_product
    key: product_key
    attribute: category
    caption: Category
    ordinal: 2
    cardinality_hint: 3
  - id: Product
    table: dim_product
    key: product_key
    attribute: product_name
    caption: Product
    ordinal: 3
    cardinality_hint: 12
  - id: Customer
    table: dim_customer
    key: customer_key
    attribute: customer_name
    caption: Customer
    ordinal: 4
    cardinality_hint: 24
  - id: Region
    table: dim_customer
    key: customer_key
    attribute: region
    caption: Region
    ordinal: 5
    cardinality_hint: 4
  - id: Segment
    table: dim_customer
    key: customer_key
    attribute: segment
    caption: Segment
    ordinal: 6
    cardinality_hint: 2

relationships:
  # Conformed join columns (`order_date_key`, `product_key`) exist on every fact
  # that uses the dimension, so one relationship per dimension serves them all.
  - { fact: fact_orders, dimension: Date, columns: [order_date_key, date_key] }
  - { fact: mart_lead_time_median_month, dimension: Date, columns: [order_date_key, date_key] }
  - { fact: mart_cumulative_month, dimension: Date, columns: [order_date_key, date_key] }
  - { fact: fact_orders, dimension: Product, columns: [product_key, product_key] }
  - { fact: mart_lead_time_median_month, dimension: Product, columns: [product_key, product_key] }
  - { fact: fact_orders, dimension: Category, columns: [product_key, product_key] }
  - { fact: mart_lead_time_median_month, dimension: Category, columns: [product_key, product_key] }
  - { fact: fact_orders, dimension: Customer, columns: [customer_key, customer_key] }
  - { fact: fact_orders, dimension: Region, columns: [customer_key, customer_key] }
  - { fact: fact_orders, dimension: Segment, columns: [customer_key, customer_key] }

measures:
  - id: Revenue
    caption: Revenue
    source: { table: fact_orders, column: revenue }
    aggregation: sum
    format: "#,##0"
  - id: Revenue YTD
    caption: Revenue YTD
    source: { table: fact_orders, column: revenue }
    aggregation: sum
    time_window: { dimension: Date, flag: ytd_flag }
    format: "#,##0"
  - id: Orders
    caption: Orders
    source: { table: fact_orders, column: is_order }
    aggregation: sum
    format: "#,##0"
  - id: Open orders
    caption: Open orders
    source: { table: fact_orders, column: is_open }
    aggregation: sum
    format: "#,##0"
  - id: Cancelled orders
    caption: Cancelled orders
    source: { table: fact_orders, column: is_cancelled }
    aggregation: sum
    format: "#,##0"
  - id: Late orders
    caption: Late orders
    source: { table: fact_orders, column: is_late }
    aggregation: sum
    format: "#,##0"
  - id: On-time %
    caption: On-time %
    source: { table: fact_orders }
    aggregation: ratio
    expression: "SUM(is_within_sla) * 100.0 / NULLIF(SUM(is_order), 0)"
    format: "0.0"
  - id: Average lead time
    caption: Average lead time (days)
    source: { table: fact_orders }
    aggregation: ratio
    expression: "SUM(sum_lead_time) / NULLIF(SUM(count_lead_time), 0)"
    format: "0.0"
  # Identity aggregate over the per-grain mart: a median is valid only at the
  # mart's grain and is never re-aggregated.
  - id: Median lead time
    caption: Median lead time (days)
    source: { table: mart_lead_time_median_month, column: median_lead_time }
    aggregation: max
    valid_grain: [year, month, product_key]
    format: "0.0"
  - id: Cumulative revenue CY
    caption: Cumulative revenue CY
    source: { table: mart_cumulative_month, column: cumulative_revenue_cy }
    aggregation: max
    valid_grain: [year, month]
    format: "#,##0"
  - id: Cumulative revenue CY-1
    caption: Cumulative revenue CY-1
    source: { table: mart_cumulative_month, column: cumulative_revenue_cy_minus_1 }
    aggregation: max
    valid_grain: [year, month]
    format: "#,##0"

time_intelligence:
  date_dimension: Date
  flags:
    ytd: ytd_flag
    qtd: qtd_flag
    mtd: mtd_flag
    prior_year_ytd: prior_year_ytd_flag
    current_year: current_year_flag

provenance:
  source_system: manual
  source_hash: "sha256:d22d01cfdbb75257a39b6bf7"
  generator: mallard-contract/0.1.0
  generated_at: "2026-09-28T00:00:00Z"

annotations:
  note: >-
    Hand-written fixture mirroring projects/upstream_marts/proxy-config.yaml
    (its sha256 prefix is the source_hash); the projection and the sqlmesh/dbt
    generators follow in later slices.
  plan: "057-A"
