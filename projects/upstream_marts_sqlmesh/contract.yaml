measures:
- id: Average lead time
  caption: Average lead time (days)
  description: Average lead time in days (ratio of sums)
  format: '0.0'
  source:
    table: fact_orders
  aggregation: ratio
  expression: SUM(sum_lead_time) / NULLIF(SUM(count_lead_time), 0)
- id: Cancelled orders
  caption: Cancelled orders
  description: Cancelled orders
  format: '#,##0'
  source:
    table: fact_orders
    column: is_cancelled
  aggregation: sum
- id: Cumulative revenue CY
  caption: Cumulative revenue CY
  description: Cumulative revenue for the current year, period-end value
  format: '#,##0'
  source:
    table: mart_cumulative_month
    column: cumulative_revenue_cy
  aggregation: max
  valid_grain:
  - year
  - month
- id: Cumulative revenue CY-1
  caption: Cumulative revenue CY-1
  description: Cumulative revenue for the same month last year, period-end value
  format: '#,##0'
