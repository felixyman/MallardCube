# The semantic layer SQLMesh cannot carry (plan 057-A). The raw TPC-H tables
# are EXTERNAL sources: they are excluded from the contract, and the served
# facts are the conformed fact and the monthly mart.
#
# Regenerate with:
#   mallard contract generate --from sqlmesh projects/tpch_sqlmesh \
#     --out projects/tpch_sqlmesh/contract.yaml

model:
  name: tpch_sales
  description: >-
    Thin projection of TPC-H: a conformed line-item fact joined to customer,
    part, supplier, nation and order-date dimensions, plus a monthly revenue
    mart for cumulative values.

exclude:
  - raw.lineitem
  - raw.orders
  - raw.customer
  - raw.part
  - raw.supplier
  - raw.nation
  - raw.region
  - raw.partsupp

grain:
  - { model: main.fact_sales, id: sales, measure_group: Sales }
  - { model: main.mart_monthly_revenue, id: monthly, measure_group: "Revenue (monthly)" }

dimensions:
  - model: main.dim_date
    id: Date
    attribute: full_date
    hierarchy_name: Calendar
    date_role: true
    caption: Date
    ordinal: 1
    cardinality_hint: 2600
    levels:
      - { name: Year, column: year, cardinality_hint: 7 }
      - { name: Quarter, column: quarter, cardinality_hint: 28 }
      - { name: Month, column: month, cardinality_hint: 84 }
      - { name: Full Date, column: full_date, cardinality_hint: 2600 }
  - { model: main.dim_customer, id: Customer, attribute: c_name, caption: Customer, ordinal: 2, cardinality_hint: 15000 }
  - { model: main.dim_part, id: Part, attribute: p_name, caption: Part, ordinal: 3, cardinality_hint: 20000 }
  - { model: main.dim_supplier, id: Supplier, attribute: s_name, caption: Supplier, ordinal: 4, cardinality_hint: 1000 }
  - { model: main.dim_nation, id: Nation, attribute: n_name, caption: Nation, ordinal: 5, cardinality_hint: 25 }

measures:
  - { metric: revenue, id: Revenue, caption: Revenue, format: "#,##0.00" }
  - { metric: revenue_ytd, id: Revenue YTD, caption: Revenue YTD, format: "#,##0.00", time_window: { dimension: Date, flag: ytd_flag } }
  - { metric: quantity, id: Quantity, caption: Quantity, format: "#,##0" }
  - { metric: line_count, id: Line count, caption: Line count, format: "#,##0", aggregation: count, source: { table: main.fact_sales } }
  - { metric: order_count, id: Order count, caption: Order count, format: "#,##0" }
  - { metric: avg_discount, id: Average discount, caption: Average discount, format: "0.0000" }
  - { metric: revenue_per_unit, id: Revenue per unit, caption: Revenue per unit, format: "0.00" }
  - { metric: monthly_revenue, id: Monthly revenue, caption: Monthly revenue, format: "#,##0.00" }
  - { metric: cumulative_revenue, id: Cumulative revenue, caption: Cumulative revenue, format: "#,##0.00" }

time_intelligence:
  date_dimension: Date
  flags:
    ytd: ytd_flag
    qtd: qtd_flag
    mtd: mtd_flag
    prior_year_ytd: prior_year_ytd_flag
    current_year: current_year_flag

annotations:
  note: >-
    Generated from the SQLMesh project beside this file; edit the models,
    metrics and contract.overlay.yaml, then regenerate.
  plan: "057-A"
  dataset: "TPC-H (DuckDB tpch extension; SF 0.1 and 1 measured)"
