name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # A tag cannot publish without the test suite: this is the gate the external
  # review asked for (plan 059).
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The converted-project databases are gitignored and regenerated from
      # tracked sources, exactly as in ci.yml.
      - name: Seed converted-project DBs
        run: cargo run --release --bin seed_projects_db

      - name: Lib tests
        run: cargo test --lib --release

      - name: Clippy
        run: cargo clippy --all-targets --release -- -D warnings

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: mallard-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: mallard-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: mallard-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*/*

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the artefacts
        run: |
          for file in artifacts/*/*; do
            cosign sign-blob --yes --bundle "$file.bundle" "$file"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            artifacts/*/*
            artifacts/*/*.bundle

  # Install from the artefact, not the repo: the review's "test installation
  # from the published artifact" (plan 059).
  install:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the Linux artefact
        uses: actions/download-artifact@v4
        with:
          name: mallard-linux-x86_64

      - name: It executes
        run: |
          chmod +x mallard-linux-x86_64
          file mallard-linux-x86_64
          ./mallard-linux-x86_64 2>&1 | head -5 || true

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mallardcube:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/mallardcube:latest

