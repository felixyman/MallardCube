name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit:
    runs-on: ubuntu-latest
    # The action creates a check run for the findings; without this the run
    # fails with "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0235 (rkyv archive validation) is not compiled into
          # anything this project builds: the only reference is rust_decimal's
          # optional `rkyv` feature, and `cargo tree --target all -i rkyv`
          # prints nothing (recorded in plan 059, 2026-09-26).
          ignore: RUSTSEC-2026-0235

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (lib)
        run: cargo clippy --lib --release -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2

      - name: Seed converted-project DBs
        run: cargo run --release --bin seed_projects_db

      - name: Test
        run: cargo test --lib --release

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: site
        run: bun install

      # `build` also runs scripts/check-links.mjs, so a broken internal link
      # (or asset reference) fails the pull request.
      - name: Build docs and check links
        working-directory: site
        run: bun run build
