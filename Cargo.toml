[package]
name = "mallardcube"
default-run = "mallard"
version = "0.1.0"
edition = "2024"
description = "SSAS Tabular replacement — Excel/XMLA frontend for DuckDB"
license = "MIT"
keywords = ["ssas", "xmla", "olap", "excel", "pivottable", "duckdb", "mdx"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "mallard"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
quick-xml = "0.37"
rusqlite = { version = "0.31", features = ["bundled"] }
duckdb = { version = "1.10503.1", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5"] }
nom = "7"
clap = { version = "4", features = ["derive"] }
regex = "1"