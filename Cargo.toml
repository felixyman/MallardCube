[package]
name = "mallardcube"
default-run = "mallard"
version = "0.1.0"
edition = "2024"
description = "SSAS Tabular replacement — Excel/XMLA frontend for DuckDB"
license = "MIT"
keywords = ["ssas", "xmla", "olap", "excel", "pivottable", "duckdb", "mdx"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "mallard"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures-core = "0.3"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
quick-xml = "0.42"
duckdb = { version = "1.10505.0", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5"] }
nom = "7"
clap = { version = "4", features = ["derive"] }
regex = "1"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
ureq = { version = "3.4.0", features = ["json"] }
yaml_serde = "0.10"

# Test builds stay small: the bundled DuckDB dependency's debug info runs to
# gigabytes per fingerprint and stale copies accumulate (154 GB of
# target/debug was measured 2026-09-27). Dependencies carry no debug info,
# the workspace keeps line tables for panics, and incremental artifacts
# (their own ~8 GB) are off.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# The rendering path is CPU-bound and the fault-on-panic design (request-level
# catch_unwind in main.rs) requires unwinding: state it explicitly so nobody
# "optimises" panic to abort and silently turns every engine error into a dead
# connection (plan 051 review).
[profile.release]
lto = "thin"
panic = "unwind"

